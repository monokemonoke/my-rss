<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KijiYomu - {{.Date}}</title>
<link rel="icon" type="image/png" href="{{.FaviconDataURI}}">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F8F8FB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F0F12" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="KijiYomu">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<script>(function(){var t=localStorage.getItem('kijiyomu-theme')||(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.dataset.theme=t;})()</script>
<style>{{.CSS}}</style>
</head>
<body>
<div class="wrap">
<header>
  <h1><img class="site-logo" src="{{.LogoDataURI}}" alt="KijiYomu"></h1>
  <span>{{.Date}}</span>
  <span class="selected-tag-label" id="selected-tag-label" hidden></span>
  <button class="theme-toggle" id="theme-toggle" onclick="(function(){var n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.setItem('kijiyomu-theme',n);document.getElementById('theme-toggle').textContent=n==='dark'?'☀':'☾';})()" title="テーマ切り替え">☾</button>
</header>
<script>(function(){var t=document.documentElement.dataset.theme;document.getElementById('theme-toggle').textContent=t==='dark'?'☀':'☾';})()</script>
<div id="articles-root"></div>
</div>
<script id="articles-data" type="application/json">{{.ArticlesJSON}}</script>
<script>
window.KIJIYOMU_PUSH = {
  endpoint: {{.PushEndpoint}},
  vapidPublicKey: {{.VAPIDPublicKey}}
};
</script>
<script type="module">{{.JS}}</script>
<script>if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');</script>
</body>
</html>
