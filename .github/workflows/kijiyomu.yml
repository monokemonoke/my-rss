name: KijiYomu

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          cache: true  # go module cache

      - name: Enable corepack
        run: corepack enable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend assets
        run: pnpm run build

      # キャッシュリストア: key が存在しなくても restore-keys で最新を取得
      - name: Restore KijiYomu cache
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: .kijiyomu_cache.json
          key: kijiyomu-cache-${{ github.run_id }}
          restore-keys: |
            kijiyomu-cache-

      # HTML・data.json・manifest・sw.js・アイコンはすべて出力先に揃うので、
      # _site へ直接書き出してコピー手順をなくす
      - name: Run KijiYomu
        env:
          AI_API_BASE: ${{ secrets.AI_API_BASE }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
        run: go run main.go --out _site/index.html

      # 常に最新状態で保存（key に run_id を含めることで毎回新規保存）
      - name: Save KijiYomu cache
        if: always()
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: .kijiyomu_cache.json
          key: kijiyomu-cache-${{ github.run_id }}

      # 旧 URL をブックマーク・PWA 登録している場合の受け皿
      - name: Add legacy path redirect
        run: |
          cat > _site/kijiyomu.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>KijiYomu</title>
          <link rel="canonical" href="./index.html">
          <meta http-equiv="refresh" content="0; url=./index.html">
          <a href="./index.html">KijiYomu</a>
          HTML

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
